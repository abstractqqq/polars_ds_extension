name: Linting and Formatting

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'python/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff==0.7.1

      - name: Run Ruff checks & format fixes
        run: |
          ruff check --fix .
          ruff format .

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          components: clippy, rustfmt

      - name: Run Cargo Format fixes
        run: cargo fmt --all

      - name: Check for changes
        id: git-status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with fixes
        if: steps.git-status.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: auto-fix formatting and lint issues"
          title: "style: automatic lint and format fixes"
          body: |
            This is an automated pull request containing formatting and linting fixes.
            Please merge this PR to fix the lint/format issues on `main`.
          branch: "auto-lint-fixes"

      - name: Fail workflow if changes were detected
        if: steps.git-status.outputs.changes == 'true'
        run: |
          echo "Linting and formatting issues were found. An automated PR has been created/updated with the fixes."
          exit 1

      - name: Run Cargo Clippy
        if: steps.git-status.outputs.changes == 'false'
        run: cargo clippy --all-targets --all-features -- -D warnings
