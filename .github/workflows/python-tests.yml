name: Test Python

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - rust-toolchain.toml
      - python/**
      - src/**
      - .github/workflows/python-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -C debuginfo=0 # Do not produce debug symbols to keep memory usage down
  RUST_BACKTRACE: 1
  PYTHONUTF8: 1

defaults:
  run:
    shell: bash

jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12", "3.13", "3.14"]
        # include:
        #   - os: windows-latest
        #     python-version: '3.13'

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Create virtual environment
        env:
          BIN: ${{ matrix.os == 'windows-latest' && 'Scripts' || 'bin' }}
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/$BIN" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install package
        run: |
          pip install -r requirements.txt
          maturin develop --release

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipython ipykernel nbconvert pytest
          pip install -r tests/requirements-test.txt

      - name: Test Notebooks
        run: |
          jupyter execute examples/basics.ipynb
          jupyter execute examples/pipeline.ipynb
          jupyter execute examples/sample_and_split.ipynb

      - name: Test EDA Notebook
        if: matrix.python-version != '3.14t'
        run: |
          pip install -r tests/requirements-test2.txt
          jupyter execute examples/eda.ipynb

      - name: Test Doc Builds
        run: |
          pip install -r docs/requirements-docs.txt
          mkdocs build

      - name: Test Pytests
        run: pytest tests/test_*
