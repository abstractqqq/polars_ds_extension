name: Test Python

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - rust-toolchain.toml
      - uv.lock
      - python/**
      - src/**
      - tests/**
      - .github/workflows/python-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -C debuginfo=0 # Do not produce debug symbols to keep memory usage down
  RUST_BACKTRACE: 1
  PYTHONUTF8: 1

defaults:
  run:
    shell: bash

jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.9", polars-version: "1.36.1"}
          - {os: ubuntu-latest, python-version: "3.12", polars-version: "1.44.2"}
          - {os: ubuntu-latest, python-version: "3.12", polars-version: "2.0.0"}
          - {os: ubuntu-latest, python-version: "3.13", polars-version: "2.0.0"}
          - {os: ubuntu-latest, python-version: "3.14", polars-version: "2.0.0"}
        # include:
        #   - os: windows-latest
        #     python-version: '3.13'

    steps:
      - uses: actions/checkout@v4

      - name: Pin Polars throughout dependency installation
        run: |
          echo 'polars==${{ matrix.polars-version }}' > "$RUNNER_TEMP/polars-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/polars-constraints.txt" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Create virtual environment
        env:
          BIN: ${{ matrix.os == 'windows-latest' && 'Scripts' || 'bin' }}
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/$BIN" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install package
        run: |
          pip install -r requirements.txt
          maturin develop --release --locked

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipython ipykernel nbconvert pytest
          pip install -r tests/requirements-test.txt

      - name: Test Notebooks
        run: |
          jupyter execute examples/basics.ipynb
          jupyter execute examples/pipeline.ipynb
          jupyter execute examples/sample_and_split.ipynb

      - name: Test EDA Notebook
        if: matrix.python-version != '3.14t'
        run: |
          pip install -r tests/requirements-test2.txt
          jupyter execute examples/eda.ipynb

      - name: Test Doc Builds
        run: |
          pip install -r docs/requirements-docs.txt
          mkdocs build

      - name: Test Pytests
        run: pytest tests/test_*

      - name: Exercise eager callers through lazy auto
        if: matrix.python-version == '3.12' && matrix.polars-version == '2.0.0'
        run: PYTHONPATH=tests pytest -p lazy_execution_plugin tests/test_*

  test-minimum-polars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimum-version environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Build and test changed contracts on the minimum Polars
        run: |
          pip install maturin numpy pytest scipy==1.17.0 polars==1.4.0
          maturin develop --release --locked
          python tests/run_legacy_compat.py
